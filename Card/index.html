<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Yeep Rank Card</title>

<link rel="icon" type="image/x-icon" href="images/favicon.ico">

<style>

:root{
  --bg:#08090d;
  --bg2:#0d1119;
  --panel:#101722;
  --panel2:#151d2a;

  --accent:#ff0055;
  --accent2:#ff3d82;
  --accent-dark:#8f0033;

  --text:#ffffff;
  --muted:#94a3b8;

  --border:rgba(255,255,255,.08);

  --radius:16px;

  --shadow:
    0 20px 60px rgba(0,0,0,.55);
}

/* =========================
   CUSTOM SCROLLBAR
========================= */

::-webkit-scrollbar{
  width:10px;
}

::-webkit-scrollbar-track{
  background:#08090d;
}

::-webkit-scrollbar-thumb{
  background:
    linear-gradient(
      180deg,
      var(--accent),
      var(--accent-dark)
    );

  border-radius:10px;

  border:2px solid #08090d;

  box-shadow:
    0 0 10px
    color-mix(
      in srgb,
      var(--accent) 35%,
      transparent
    );
}

::-webkit-scrollbar-thumb:hover{
  background:var(--accent-2);

  box-shadow:
    0 0 18px
    color-mix(
      in srgb,
      var(--accent) 60%,
      transparent
    );
}

/* =========================
   GLOBAL
========================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  min-height:100vh;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);

  padding:35px 18px;

  background:

    radial-gradient(
      circle at 10% 10%,
      color-mix(
        in srgb,
        var(--accent) 15%,
        transparent
      ),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 90%,
      color-mix(
        in srgb,
        var(--accent) 12%,
        transparent
      ),
      transparent 35%
    ),

    linear-gradient(
      145deg,
      var(--bg),
      var(--accent-dark)
    );

  transition:
    background .35s ease;
}


/* subtle grid */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  background:

    linear-gradient(
      rgba(255,255,255,.018) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.018) 1px,
      transparent 1px
    );

  background-size:35px 35px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent
    );

  z-index:-1;
}


/* =========================
   WRAPPER
========================= */

.wrapper{

  width:100%;

  max-width:950px;

  margin:auto;

  text-align:center;
}


/* =========================
   TOP BAR
========================= */

.topbar{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:8px;

  margin-bottom:22px;

  flex-wrap:wrap;
}


/* =========================
   SEARCH AREA
========================= */

.search{

  position:relative;

  display:flex;

  gap:7px;

  align-items:center;

  justify-content:center;

  margin-bottom:22px;

  flex-wrap:wrap;
}


.search-box{

  position:relative;

  width:270px;
}


input{

  width:100%;

  padding:12px 14px;

  border-radius:11px;

  border:1px solid var(--border);

  outline:none;

  color:white;

  background:
    rgba(255,255,255,.055);

  font-size:14px;

  transition:
    border .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}


input::placeholder{
  color:var(--muted);
}


input:focus{

  border-color:var(--accent);

  background:
    rgba(255,255,255,.075);

  box-shadow:

    0 0 0 3px
    color-mix(
      in srgb,
      var(--accent) 13%,
      transparent
    ),

    0 0 25px
    color-mix(
      in srgb,
      var(--accent) 12%,
      transparent
    );
}


/* =========================
   PLAYER DROPDOWN
========================= */

.player-dropdown{

  position:absolute;

  top:calc(100% + 7px);

  left:0;

  right:0;

  max-height:300px;

  overflow-y:auto;

  padding:6px;

  border-radius:14px;

  background:

    linear-gradient(
      145deg,
      rgba(18,25,36,.98),
      rgba(5,8,13,.98)
    );

  border:1px solid var(--border);

  box-shadow:

    0 20px 55px
    rgba(0,0,0,.65),

    0 0 25px
    color-mix(
      in srgb,
      var(--accent) 10%,
      transparent
    );

  backdrop-filter:blur(14px);

  z-index:500;

  display:none;

  text-align:left;

  animation:
    dropdownIn .16s ease;
}


.player-dropdown.active{
  display:block;
}


@keyframes dropdownIn{

  from{
    opacity:0;
    transform:translateY(-5px) scale(.98);
  }

  to{
    opacity:1;
    transform:none;
  }

}


.player-dropdown::-webkit-scrollbar{
  width:5px;
}


.player-dropdown::-webkit-scrollbar-thumb{

  background:var(--accent);

  border-radius:10px;
}


.player-option{

  display:flex;

  align-items:center;

  gap:10px;

  width:100%;

  padding:9px;

  border:1px solid transparent;

  border-radius:10px;

  background:transparent;

  color:white;

  cursor:pointer;

  text-align:left;

  transition:
    background .18s ease,
    transform .18s ease,
    border .18s ease;
}


.player-option:hover{

  background:

    color-mix(
      in srgb,
      var(--accent) 10%,
      rgba(255,255,255,.03)
    );

  border-color:

    color-mix(
      in srgb,
      var(--accent) 25%,
      transparent
    );

  transform:translateX(3px);
}


.player-option-avatar{

  width:34px;

  height:34px;

  flex-shrink:0;

  border-radius:9px;

  object-fit:cover;

  background:#111;

  border:1px solid var(--border);
}


.player-option-name{

  font-size:13px;

  font-weight:800;
}


.player-option-title{

  font-size:11px;

  color:var(--muted);

  margin-top:2px;
}


.no-results{

  padding:15px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}


/* =========================
   BUTTONS
========================= */

button{

  padding:11px 15px;

  border:1px solid transparent;

  border-radius:11px;

  color:white;

  cursor:pointer;

  font-weight:700;

  background:

    linear-gradient(
      135deg,
      var(--accent),
      var(--accent-dark)
    );

  box-shadow:

    0 6px 18px
    color-mix(
      in srgb,
      var(--accent) 18%,
      transparent
    );

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease,
    border .2s ease;
}


button:hover{

  transform:
    translateY(-2px)
    scale(1.01);

  box-shadow:

    0 10px 28px
    color-mix(
      in srgb,
      var(--accent) 28%,
      transparent
    );
}


button:active{

  transform:scale(.97);
}


.settings-button{

  background:
    rgba(255,255,255,.055);

  border-color:var(--border);
}


.settings-button:hover{

  background:
    rgba(255,255,255,.09);

  border-color:

    color-mix(
      in srgb,
      var(--accent) 45%,
      transparent
    );
}


/* =========================
   CARD CONTAINER
========================= */

#card{

  display:flex;

  justify-content:center;

  width:100%;
}


/* =========================
   PROFILE CARD
========================= */

.profile-card{

  position:relative;

  width:720px;

  max-width:100%;

  overflow:hidden;

  padding:25px;

  border-radius:20px;

  background:

    linear-gradient(
      135deg,
      rgba(11,11,13,.96),
      color-mix(
        in srgb,
        var(--accent-dark) 85%,
        #08090d
      )
    );

  border:1px solid
    color-mix(
      in srgb,
      var(--accent) 45%,
      transparent
    );

  box-shadow:

    0 0 0 2px
    color-mix(
      in srgb,
      var(--accent) 20%,
      transparent
    ),

    0 20px 60px
    rgba(0,0,0,.55),

    0 0 35px
    color-mix(
      in srgb,
      var(--accent) 12%,
      transparent
    );

  text-align:left;

  animation:
    cardIn .3s ease;

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}


.profile-card:hover{

  transform:translateY(-3px);

  box-shadow:

    0 0 0 2px
    color-mix(
      in srgb,
      var(--accent) 30%,
      transparent
    ),

    0 25px 70px
    rgba(0,0,0,.65),

    0 0 45px
    color-mix(
      in srgb,
      var(--accent) 18%,
      transparent
    );
}


.profile-card::before{

  content:"";

  position:absolute;

  top:0;
  left:0;
  right:0;

  height:3px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--accent),
      transparent
    );

  opacity:.8;
}


@keyframes cardIn{

  from{

    opacity:0;

    transform:
      translateY(12px)
      scale(.98);

  }

  to{

    opacity:1;

    transform:none;

  }

}


/* =========================
   HEADER
========================= */

.header{

  display:flex;

  gap:20px;

  align-items:center;
}


.avatar{

  width:110px;

  height:110px;

  flex-shrink:0;

  border-radius:15px;

  object-fit:cover;

  background:#111;

  border:2px solid
    color-mix(
      in srgb,
      var(--accent) 40%,
      transparent
    );

  box-shadow:

    0 8px 25px
    rgba(0,0,0,.4),

    0 0 20px
    color-mix(
      in srgb,
      var(--accent) 15%,
      transparent
    );

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}


.profile-card:hover .avatar{

  transform:
    scale(1.04)
    rotate(-1deg);

  box-shadow:

    0 0 30px
    color-mix(
      in srgb,
      var(--accent) 25%,
      transparent
    );
}


.header-info h1{

  margin:0;

  font-size:28px;

  font-weight:900;

  letter-spacing:-.5px;
}


.title{

  display:flex;

  align-items:center;

  gap:8px;

  margin-top:7px;

  font-weight:700;

  color:var(--accent2);
}


.title img{

  width:24px;

  height:24px;

  object-fit:contain;
}


.team-name{

  margin-top:7px;

  font-size:13px;

  color:var(--accent);

  font-weight:800;
}


/* =========================
   STATS
========================= */

.stats{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  margin-top:24px;

  gap:12px;

  text-align:center;
}


.stat{

  background:
    rgba(0,0,0,.3);

  border:1px solid var(--border);

  border-radius:13px;

  padding:14px;

  transition:
    transform .2s ease,
    border .2s ease,
    background .2s ease;
}


.stat:hover{

  transform:translateY(-3px);

  background:
    rgba(255,255,255,.045);

  border-color:

    color-mix(
      in srgb,
      var(--accent) 35%,
      transparent
    );
}


.stat span{

  display:block;

  font-size:11px;

  color:var(--muted);

  margin-bottom:4px;
}


.stat strong{

  font-size:19px;

  color:white;
}


/* =========================
   TIERS
========================= */

.tiers{

  display:flex;

  flex-wrap:wrap;

  gap:13px;

  margin-top:23px;

  justify-content:center;
}


.tier{

  width:67px;

  text-align:center;

  font-size:11px;

  color:white;

  transition:
    transform .2s ease;
}


.tier:hover{

  transform:
    translateY(-5px)
    scale(1.05);
}


.tier img{

  width:67px;

  height:67px;

  object-fit:cover;

  border-radius:10px;

  background:

    linear-gradient(
      180deg,
      transparent,
      transparent,
      var(--accent-dark)
    );

  border:1px solid
    var(--border);

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.3);

  transition:
    border .2s ease,
    box-shadow .2s ease;
}


.tier:hover img{

  border-color:
    color-mix(
      in srgb,
      var(--accent) 60%,
      transparent
    );

  box-shadow:

    0 8px 22px
    rgba(0,0,0,.45),

    0 0 15px
    color-mix(
      in srgb,
      var(--accent) 18%,
      transparent
    );
}


.tier span{

  display:block;

  margin-top:5px;

  color:var(--muted);

  font-weight:600;
}


/* =========================
   EMPTY / ERROR
========================= */

.empty-card{

  padding:30px;

  color:var(--muted);

  text-align:center;
}


/* =========================
   SETTINGS OVERLAY
========================= */

.settings-overlay{

  position:fixed;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:blur(8px);

  z-index:1000;
}


.settings-overlay.active{

  display:flex;

  animation:
    fadeIn .2s ease;
}


@keyframes fadeIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


/* =========================
   SETTINGS CARD
========================= */

.settings-card{

  position:relative;

  width:480px;

  max-width:100%;

  padding:24px;

  border-radius:20px;

  background:

    linear-gradient(
      145deg,
      var(--panel),
      var(--accent-dark)
    );

  border:1px solid
    color-mix(
      in srgb,
      var(--accent) 35%,
      transparent
    );

  box-shadow:

    0 30px 80px
    rgba(0,0,0,.7);

  animation:
    settingsIn .3s cubic-bezier(.2,.8,.2,1);
}


@keyframes settingsIn{

  from{

    opacity:0;

    transform:
      translateY(15px)
      scale(.96);

  }

  to{

    opacity:1;

    transform:none;

  }

}


.settings-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:18px;
}


.settings-header h2{

  margin:0;

  font-size:21px;
}


.settings-close{

  width:36px;

  height:36px;

  padding:0;

  border:1px solid var(--border);

  background:
    rgba(255,255,255,.05);

  font-size:20px;

  line-height:1;
}


.settings-close:hover{

  background:var(--accent);

  transform:
    rotate(90deg);
}


/* =========================
   THEME GRID
========================= */

.theme-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-top:18px;
}


.theme-option{

  display:flex;

  align-items:center;

  gap:11px;

  padding:12px;

  border-radius:12px;

  background:
    rgba(255,255,255,.035);

  border:1px solid var(--border);

  cursor:pointer;

  text-align:left;

  color:white;

  transition:
    transform .2s ease,
    border .2s ease,
    box-shadow .2s ease;
}


.theme-option:hover{

  transform:translateY(-2px);

  border-color:

    color-mix(
      in srgb,
      var(--theme) 65%,
      transparent
    );

  box-shadow:

    0 8px 20px
    color-mix(
      in srgb,
      var(--theme) 15%,
      transparent
    );
}


.theme-option.active{

  border-color:var(--theme);

  box-shadow:

    0 0 20px
    color-mix(
      in srgb,
      var(--theme) 18%,
      transparent
    );
}


.theme-dot{

  width:29px;

  height:29px;

  flex-shrink:0;

  border-radius:50%;

  background:var(--theme);

  box-shadow:

    0 0 15px
    color-mix(
      in srgb,
      var(--theme) 50%,
      transparent
    );
}


.theme-name{

  font-size:13px;

  font-weight:800;
}


.settings-description{

  margin-top:18px;

  color:var(--muted);

  font-size:12px;

  line-height:1.5;
}


/* =========================
   FOOTER
========================= */

.footer{

  margin-top:25px;

  color:var(--muted);

  font-size:11px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  body{
    padding:20px 12px;
  }

  .search{
    flex-direction:column;
  }

  .search-box{
    width:100%;
  }

  .search > button{
    width:100%;
    margin:0;
  }

  .header{
    flex-direction:column;
    text-align:center;
  }

  .title{
    justify-content:center;
  }

  .team-name{
    text-align:center;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .profile-card{
    padding:18px;
  }

  .theme-grid{
    grid-template-columns:1fr;
  }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:400px){

  .avatar{

    width:90px;
    height:90px;

  }

  .header-info h1{

    font-size:23px;

  }

  .tier{

    width:58px;

  }

  .tier img{

    width:58px;
    height:58px;

  }

}

</style>
</head>


<body>


<div class="wrapper">


  <!-- =========================
       SEARCH
  ========================= -->

  <div class="search">

    <div class="search-box">

      <input
        id="playerInput"
        placeholder="Choose a player..."
        autocomplete="off"
      >

      <div
        class="player-dropdown"
        id="playerDropdown"
      ></div>

    </div>


    <button
      id="findButton"
    >
      🔎 Find Player
    </button>

    <button
      class="settings-button"
      id="settingsButton"
    >
      ⚙️ Settings
    </button>

  </div>


  <!-- =========================
       CARD
  ========================= -->

  <div id="card">

    <div class="profile-card empty-card">

      <div style="font-size:30px;">
        🏆
      </div>

      <strong>
        Choose a player
      </strong>

      <div style="margin-top:6px;">
        Start typing a name above.
      </div>

    </div>

  </div>


  <div class="footer">
    
  </div>


</div>


<!-- =========================
     SETTINGS
========================= -->

<div
  class="settings-overlay"
  id="settingsOverlay"
>

  <div class="settings-card">

    <div class="settings-header">

      <h2>
        ⚙️ Settings
      </h2>

      <button
        class="settings-close"
        id="settingsClose"
      >
        ×
      </button>

    </div>


    <div
      style="
        color:var(--muted);
        font-size:13px;
      "
    >
      Choose a Color Theme.
    </div>


    <div
      class="theme-grid"
      id="themeGrid"
    ></div>


    <div class="settings-description">

      Your Theme is automatically saved.

    </div>

  </div>

</div>


<!-- =========================
     HTML2CANVAS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>


<script type="module">

import { players } from "../Players.js";


/* =========================
   ELEMENTS
========================= */

const playerInput =
  document.getElementById("playerInput");

const playerDropdown =
  document.getElementById("playerDropdown");

const findButton =
  document.getElementById("findButton");

const downloadButton =
  document.getElementById("downloadButton");

const settingsButton =
  document.getElementById("settingsButton");

const settingsOverlay =
  document.getElementById("settingsOverlay");

const settingsClose =
  document.getElementById("settingsClose");

const themeGrid =
  document.getElementById("themeGrid");

const cardContainer =
  document.getElementById("card");


/* =========================
   THEMES
========================= */

const themes = [

  {
    name:"Default",
    accent:"#ff0055",
    accent2:"#ff3d82",
    dark:"#8f0033"
  },

    {
    name:"Red",
    accent:"#ff1744",
    accent2:"#ff5252",
    dark:"#7f0015"
  },

    {
    name:"Orange",
    accent:"#ff7a00",
    accent2:"#ffad5c",
    dark:"#7a2900"
  },

  {
    name:"Gold",
    accent:"#ffc400",
    accent2:"#ffe082",
    dark:"#755700"
  },

  {
    name:"Lime",
    accent:"#a8ff00",
    accent2:"#d4ff70",
    dark:"#405c00"
  },

  {
    name:"Green",
    accent:"#00e676",
    accent2:"#69f0ae",
    dark:"#005c32"
  },

  {
    name:"Cyan",
    accent:"#00e5ff",
    accent2:"#67e8f9",
    dark:"#005563"
  },

  {
    name:"Blue",
    accent:"#008cff",
    accent2:"#38b6ff",
    dark:"#003d70"
  },

  {
    name:"Purple",
    accent:"#9b5cff",
    accent2:"#c084fc",
    dark:"#4c1d75"
  },

  {
    name:"Ice",
    accent:"#fffbff",
    accent2:"#f3f6ff",
    dark:"#5c7780"
  }

];


/* =========================
   THEME SYSTEM
========================= */

function applyTheme(theme){

  document.documentElement.style.setProperty(
    "--accent",
    theme.accent
  );

  document.documentElement.style.setProperty(
    "--accent2",
    theme.accent2
  );

  document.documentElement.style.setProperty(
    "--accent-dark",
    theme.dark
  );


  localStorage.setItem(
    "yeeplist-card-theme",
    theme.name
  );


  document
    .querySelectorAll(".theme-option")
    .forEach(option => {

      option.classList.toggle(
        "active",
        option.dataset.theme === theme.name
      );

    });

}


/* =========================
   CREATE THEME BUTTONS
========================= */

function createThemes(){

  themeGrid.innerHTML = "";


  themes.forEach(theme => {

    const button =
      document.createElement("button");


    button.className =
      "theme-option";


    button.dataset.theme =
      theme.name;


    button.style.setProperty(
      "--theme",
      theme.accent
    );


    button.innerHTML = `

      <span class="theme-dot"></span>

      <span class="theme-name">
        ${theme.name}
      </span>

    `;


    button.addEventListener(
      "click",
      () => {

        applyTheme(theme);

      }
    );


    themeGrid.appendChild(button);

  });


  const saved =
    localStorage.getItem(
      "yeeplist-card-theme"
    );


  const selected =
    themes.find(
      theme =>
        theme.name === saved
    ) || themes[0];


  applyTheme(selected);

}


createThemes();


/* =========================
   SAFE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   PLAYER LIST
========================= */

function getPlayerNames(){

  return [...players]
    .filter(p => p && p.name)
    .sort(
      (a,b) =>
        a.name.localeCompare(
          b.name
        )
    );

}


/* =========================
   SHOW PLAYER DROPDOWN
========================= */

function showPlayerDropdown(){

  const query =
    playerInput.value
      .trim()
      .toLowerCase();


  const filtered =
    getPlayerNames()
      .filter(player =>

        player.name
          .toLowerCase()
          .includes(query)

      )
      .slice(0,50);


  playerDropdown.innerHTML = "";


  if(filtered.length === 0){

    playerDropdown.innerHTML = `

      <div class="no-results">
        No players found
      </div>

    `;

    playerDropdown.classList.add(
      "active"
    );

    return;

  }


  filtered.forEach(player => {

    const option =
      document.createElement("button");


    option.type = "button";

    option.className =
      "player-option";


    option.innerHTML = `

      <img
        class="player-option-avatar"
        src="${escapeHTML(player.avatar)}"
        alt=""
      >

      <div>

        <div class="player-option-name">
          ${escapeHTML(player.name)}
        </div>

        <div class="player-option-title">
          ${escapeHTML(player.title || "")}
        </div>

      </div>

    `;


    option.addEventListener(
      "click",
      () => {

        playerInput.value =
          player.name;

        playerDropdown.classList.remove(
          "active"
        );

        generateCard(player);

      }
    );


    playerDropdown.appendChild(
      option
    );

  });


  playerDropdown.classList.add(
    "active"
  );

}


/* =========================
   INPUT EVENTS
========================= */

playerInput.addEventListener(
  "focus",
  () => {

    showPlayerDropdown();

  }
);


playerInput.addEventListener(
  "input",
  () => {

    showPlayerDropdown();

  }
);


/* =========================
   ENTER KEY
========================= */

playerInput.addEventListener(
  "keydown",
  event => {

    if(event.key !== "Enter") return;

    event.preventDefault();

    const query =
      playerInput.value
        .trim()
        .toLowerCase();


    if(!query){

      showPlayerDropdown();

      return;

    }


    const player =
      players.find(
        p =>
          p.name &&
          p.name.toLowerCase() === query
      );


    if(player){

      playerDropdown.classList.remove(
        "active"
      );

      generateCard(player);

      return;

    }


    const partial =
      players.find(
        p =>
          p.name &&
          p.name.toLowerCase().includes(query)
      );


    if(partial){

      playerInput.value =
        partial.name;

      playerDropdown.classList.remove(
        "active"
      );

      generateCard(partial);

      return;

    }


    showPlayerDropdown();

  }
);


/* =========================
   CLOSE DROPDOWN
========================= */

document.addEventListener(
  "click",
  event => {

    if(
      !event.target.closest(
        ".search-box"
      )
    ){

      playerDropdown.classList.remove(
        "active"
      );

    }

  }
);


/* =========================
   GENERATE CARD
========================= */

function generateCard(playerOverride = null){

  let player =
    playerOverride;


  if(!player){

    const input =
      playerInput.value
        .trim()
        .toLowerCase();


    player =
      players.find(
        p =>
          p.name &&
          p.name.toLowerCase() === input
      );

  }


  if(!player){

    cardContainer.innerHTML = `

      <div class="profile-card empty-card">

        <div style="font-size:30px;">
          ❌
        </div>

        <strong>
          Player not found
        </strong>

        <div style="margin-top:6px;">
          Choose a player from the list above.
        </div>

      </div>

    `;

    return;

  }


  playerInput.value =
    player.name;


  const team =
    player.team || "No Team";


  const categories =
    Array.isArray(player.categories)
      ? player.categories
      : [];


  cardContainer.innerHTML = `

    <div class="profile-card">

      <div class="header">

        <img
          class="avatar"
          src="${escapeHTML(player.avatar)}"
          alt="${escapeHTML(player.name)}"
        >


        <div class="header-info">

          <h1>
            ${escapeHTML(player.name)}
          </h1>


          <div class="title">

            <img
              src="${escapeHTML(player.rank)}"
              alt=""
            >

            ${escapeHTML(player.title)}
          
          </div>


          <div class="team-name">

            ${escapeHTML(team)}

          </div>

        </div>

      </div>


      <div class="stats">

        <div class="stat">

          <span>
            Score
          </span>

          <strong>
            ${escapeHTML(player.score)}
          </strong>

        </div>


        <div class="stat">

          <span>
            Rank
          </span>

          <strong>
            ${escapeHTML(
              player.title
                ? player.title.split(" ")[0]
                : "—"
            )}
          </strong>

        </div>


        <div class="stat">

          <span>
            Team
          </span>

          <strong>
            ${escapeHTML(team)}
          </strong>

        </div>

      </div>


      <div class="tiers">

        ${
          categories.length

          ?

          categories.map(c => `

            <div class="tier">

              <img
                src="${escapeHTML(c.img)}"
                alt="${escapeHTML(c.cat || c.pos || "Tier")}"
              >

              <span>

                ${escapeHTML(
                  c.pos || c.cat || "—"
                )}

              </span>

            </div>

          `).join("")

          :

          `

            <div
              style="
                color:var(--muted);
                font-size:12px;
              "
            >
              No category information
            </div>

          `

        }

      </div>

    </div>

  `;

}


/* =========================
   FIND BUTTON
========================= */

findButton.addEventListener(
  "click",
  () => {

    generateCard();

  }
);


/* =========================
   DOWNLOAD CARD
========================= */

async function downloadCard() {

  const card = document.querySelector(".profile-card");

  if (!card) {
    alert("❌ Please find a player first!");
    return;
  }

  try {

    // Wait for all images inside the card to finish loading
    const images = [...card.querySelectorAll("img")];

    await Promise.all(
      images.map(img => {

        if (img.complete) {
          return Promise.resolve();
        }

        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });

      })
    );


    // Small delay so the browser finishes rendering
    await new Promise(resolve =>
      setTimeout(resolve, 100)
    );


    const canvas = await html2canvas(card, {

      scale: 2,

      useCORS: true,

      allowTaint: false,

      backgroundColor: null,

      imageTimeout: 15000,

      logging: false

    });


    // Convert canvas to PNG
    canvas.toBlob(blob => {

      if (!blob) {
        alert("❌ Could not create the image.");
        return;
      }


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        "yeep-player-card.png";


      document.body.appendChild(link);

      link.click();

      link.remove();


      // Clean up the temporary URL
      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);


    }, "image/png");


  } catch (error) {

    console.error(
      "Player card download failed:",
      error
    );

    alert(
      "❌ The card could not be downloaded. Check the browser console for more information."
    );

  }

}


/* =========================
   SETTINGS OPEN
========================= */

settingsButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    settingsOverlay.classList.add(
      "active"
    );

  }
);


/* =========================
   SETTINGS CLOSE
========================= */

settingsClose.addEventListener(
  "click",
  () => {

    settingsOverlay.classList.remove(
      "active"
    );

  }
);


/* =========================
   CLOSE SETTINGS
========================= */

settingsOverlay.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      settingsOverlay
    ){

      settingsOverlay.classList.remove(
        "active"
      );

    }

  }
);


/* =========================
   ESCAPE
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key !== "Escape")
      return;


    playerDropdown.classList.remove(
      "active"
    );


    settingsOverlay.classList.remove(
      "active"
    );

  }
);


/* =========================
   INITIAL
========================= */

playerInput.focus();

showPlayerDropdown();

</script>
